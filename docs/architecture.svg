<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Plot Speaks technical design</title><desc id="d">Players talk to their own AI assistant. The assistant calls the Plot Speaks MCP server, a Cloudflare Worker that holds every answer key and runs the game engines, with D1, KV, Workers AI and static assets behind it. Stories are linted and built into the Worker; the public repository holds the stories without their answer keys.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B2643"/></marker></defs>
<rect width="1280" height="900" fill="#FBF8F3"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#14233D" text-anchor="start">Plot Speaks: how it works</text>
<text x="40" y="78" font-size="14.5" font-weight="400" fill="#4B5B73" text-anchor="start">Voice games and stories played with your own AI assistant. The assistant narrates; the server keeps every answer.</text>
